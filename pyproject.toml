[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tuya-v2"
version = "0.1.0"
description = "Heat Pump Energy Monitor v2 - core computation engine"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
