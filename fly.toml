# fly.toml app configuration file generated for scop on 2026-08-13T19:37:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scop'
primary_region = 'ams'

[build]

[env]
  # SERVER_TIMEZONE_OFFSET jest nadpisywany dynamiczną funkcją get_timezone_offset()
  # w config.py (używa zoneinfo dla Europe/Warsaw: CEST=+2, CET=+1).
  # Ta wartość służy tylko jako fallback dla środowisk bez zoneinfo.
  SERVER_TIMEZONE_OFFSET = "2"
  DAILY_REPORT_HOUR = "8"
  DB_FILE = "/data/tuya_telemetry.db"

[[mounts]]
  source = 'tuya_data'
  destination = '/data'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/_stcore/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
